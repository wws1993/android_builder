name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ================= 方案：手动安装并锁定 Gradle 8.7 =================
      # 这种方式不使用任何可能会导致 400 错误的缓存插件
      - name: Setup Gradle 8.7
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          sudo unzip -q gradle-8.7-bin.zip -d /opt
          echo "/opt/gradle-8.7/bin" >> $GITHUB_PATH
          rm gradle-8.7-bin.zip

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'tools platform-tools build-tools;29.0.3 build-tools;33.0.2 platforms;android-33'

      # runner 默认 ANDROID_HOME 为 /usr/local/lib/android/sdk，sign 插件可能使用该路径
      - name: Ensure build-tools 29.0.3 in default SDK
        run: |
          DEFAULT_SDK="/usr/local/lib/android/sdk"
          if [[ -d "$DEFAULT_SDK" ]] && [[ ! -d "$DEFAULT_SDK/build-tools/29.0.3" ]]; then
            yes | sdkmanager --sdk_root="$DEFAULT_SDK" "build-tools;29.0.3" || true
          fi

      - name: Install Cordova
        run: npm install -g cordova

      # 检查 Gradle 版本，确保生效（日志中应显示 8.7）
      - name: Check Gradle Version
        run: gradle -v

      - name: Prepare Platform
        run: cordova platform add android --no-interactive

      - name: Build Android APK
        run: |
          if [[ "${{ github.event.head_commit.message }}" == *"[release]"* ]]; then
            echo "模式: Release (生产环境)"
            cordova build android --release --verbose -- --packageType=apk
          else
            echo "模式: Debug (测试环境)"
            cordova build android --debug --verbose
          fi

      - name: Sign APK (Only for Release)
        if: success() && contains(github.event.head_commit.message, '[release]')
        id: sign_app
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_PW: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PW: ${{ secrets.KEY_PASSWORD }}
        run: |
          RELEASE_DIR="platforms/android/app/build/outputs/apk/release"
          APK=$(ls "$RELEASE_DIR"/*.apk 2>/dev/null | head -1)
          [[ -z "$APK" ]] && { echo "No APK found"; exit 1; }
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          BT="$SDK/build-tools/33.0.2"
          [[ ! -d "$BT" ]] && BT="$SDK/build-tools/29.0.3"
          echo "$KEYSTORE_B64" | base64 -d > keystore.jks
          ALIGNED="${APK%.apk}-aligned.apk"
          SIGNED="${APK%.apk}-signed.apk"
          "$BT/zipalign" -f -v 4 "$APK" "$ALIGNED"
          "$BT/apksigner" sign --ks keystore.jks --ks-key-alias "$KEY_ALIAS" --ks-pass "pass:$KEYSTORE_PW" --key-pass "pass:$KEY_PW" --out "$SIGNED" "$ALIGNED"
          rm -f keystore.jks "$ALIGNED"
          echo "signedReleaseFile=$SIGNED" >> $GITHUB_OUTPUT

      - name: Upload Artifact (Release)
        if: contains(github.event.head_commit.message, '[release]')
        uses: actions/upload-artifact@v4
        with:
          name: kaigeer-apk
          path: ${{ steps.sign_app.outputs.signedReleaseFile }}

      - name: Upload Artifact (Debug)
        if: contains(github.event.head_commit.message, '[release]') == false
        uses: actions/upload-artifact@v4
        with:
          name: kaigeer-apk
          path: platforms/android/app/build/outputs/apk/debug/*.apk